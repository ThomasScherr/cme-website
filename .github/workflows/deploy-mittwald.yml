name: Build & Deploy to Mittwald

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.mittwald
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Der Stack zeigt auf :latest. Dieser Webhook weist Mittwald an, das
      # Image neu zu ziehen und den Container neu zu erstellen.
      #
      # Frueher stand hier ein PUT auf /v2/stacks/{id} mit einem
      # environment-Block, der nur NODE_ENV und PORT enthielt. PUT ersetzt die
      # Service-Definition vollstaendig - DATABASE_URL, JWT_SECRET,
      # ADMIN_PASSWORD und OPENAI_API_KEY waeren bei jedem Deploy geloescht
      # worden. Der Webhook kann das nicht: er darf ausschliesslich das Image
      # dieses einen Service neu ziehen.
      #
      # Wichtig: Der Webhook antwortet nur auf GET. POST liefert 404.
      - name: Deploy to Mittwald
        env:
          DEPLOY_WEBHOOK: ${{ secrets.MITTWALD_DEPLOY_WEBHOOK }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_WEBHOOK:-}" ]; then
            echo "::error::Repository-Secret MITTWALD_DEPLOY_WEBHOOK ist nicht gesetzt."
            exit 1
          fi

          echo "Loese Image-Pull bei Mittwald aus ..."

          # Die URL enthaelt den Webhook-Token und darf nicht ins Log geraten.
          # Deshalb nur den Statuscode auswerten, nie die URL ausgeben.
          STATUS=$(curl --silent --show-error \
                        --request GET \
                        --retry 3 --retry-delay 5 --retry-connrefused \
                        --max-time 60 \
                        --output response.txt \
                        --write-out '%{http_code}' \
                        "$DEPLOY_WEBHOOK" || echo "000")

          if [ "$STATUS" != "204" ]; then
            echo "::error::Mittwald-Webhook antwortete mit HTTP $STATUS (erwartet: 204)."
            echo "Antwort:"
            cat response.txt || true
            exit 1
          fi

          echo "Mittwald zieht das neue Image (HTTP 204)."

      - name: Warten bis der Container wieder laeuft
        run: |
          set -euo pipefail

          URL="https://p-w48lps.project.space/"
          echo "Warte auf $URL ..."

          for i in $(seq 1 30); do
            STATUS=$(curl --silent --output /dev/null --max-time 10 \
                          --write-out '%{http_code}' "$URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Container laeuft wieder (nach $((i * 10)) Sekunden)."
              exit 0
            fi
            echo "  [$((i * 10))s] HTTP $STATUS"
            sleep 10
          done

          echo "::error::Container ist nach 5 Minuten nicht erreichbar."
          exit 1
