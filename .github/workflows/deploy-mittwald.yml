name: Build & Deploy to Mittwald

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.mittwald
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to Mittwald
        env:
          MITTWALD_API_TOKEN: ${{ secrets.MITTWALD_API_TOKEN }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT \
            -H "Authorization: Bearer $MITTWALD_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.mittwald.de/v2/stacks/e151a4e3-e460-4a55-881c-78f172264656" \
            -d '{
              "services": {
                "cme-website": {
                  "image": "ghcr.io/${{ github.repository }}:latest",
                  "ports": ["3000:3000/tcp"],
                  "environment": {
                    "NODE_ENV": "production",
                    "PORT": "3000",
                    "DATABASE_URL": "${{ secrets.DATABASE_URL }}",
                    "JWT_SECRET": "${{ secrets.JWT_SECRET }}",
                    "VITE_APP_ID": "cme-standalone",
                    "OAUTH_SERVER_URL": "https://oauth.placeholder.invalid",
                    "OWNER_OPEN_ID": "5TmaQEz2Nf7HZVq7qnTDRT",
                    "OWNER_NAME": "Thomas Scherr",
                    "ADMIN_PASSWORD": "${{ secrets.ADMIN_PASSWORD }}",
                    "OPENAI_API_KEY": "${{ secrets.OPENAI_API_KEY }}"
                  }
                }
              }
            }')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Deployment triggered successfully"
          else
            echo "Deployment failed: $BODY"
            exit 1
          fi
