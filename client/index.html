    <!-- DSGVO: Block non-essential third-party cookies before any other script runs -->
    <script>
      (function() {
        var CONSENT_KEY = 'cme-cookie-consent';
        var BLOCKED_PREFIXES = ['AMP_', 'crisp-client'];

        function hasAnalyticsConsent() {
          try {
            var raw = localStorage.getItem(CONSENT_KEY);
            if (!raw) return false;
            var parsed = JSON.parse(raw);
            return parsed && parsed.analytics === true;
          } catch(e) { return false; }
        }

        function deleteBlockedCookies() {
          var cookies = document.cookie.split(';');
          var dominated = [window.location.hostname, '.' + window.location.hostname];
          for (var i = 0; i < cookies.length; i++) {
            var name = cookies[i].split('=')[0].trim();
            for (var j = 0; j < BLOCKED_PREFIXES.length; j++) {
              if (name.indexOf(BLOCKED_PREFIXES[j]) === 0) {
                for (var d = 0; d < dominated.length; d++) {
                  document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; domain=' + dominated[d];
                }
                document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
              }
            }
          }
        }

        // Immediate cleanup on page load
        if (!hasAnalyticsConsent()) {
          deleteBlockedCookies();
          // Re-check periodically for the first 5 seconds (cookies may be set async)
          var checks = 0;
          var interval = setInterval(function() {
            if (hasAnalyticsConsent()) { clearInterval(interval); return; }
            deleteBlockedCookies();
            checks++;
            if (checks >= 10) clearInterval(interval);
          }, 500);
        }

        // Listen for consent changes
        window.addEventListener('consent-updated', function(e) {
          if (!e.detail || !e.detail.analytics) {
            deleteBlockedCookies();
          }
        });
      })();
    </script>
