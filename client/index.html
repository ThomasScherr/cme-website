        <main>
          <h1 style="font-size:2rem;font-weight:700;margin-bottom:1rem;">Elektronikentwicklung & EMS-Fertigung aus einer Hand</h1>
          <p style="font-size:1.125rem;line-height:1.7;margin-bottom:2rem;">
            CME Control Motion Electronics GmbH ist Ihr Entwicklungsdienstleister und EMS-Partner für
            Leistungselektronik, Antriebselektronik, Mechatronik und thermisch anspruchsvolle Elektronikprojekte.
            Vom ersten Entwurf bis zur Serienfertigung – alles aus einer Hand am Standort Dortmund.
          </p>

          <section style="margin-bottom:2rem;">
            <h2>Elektronikentwicklung</h2>
            <p>Systemarchitektur, Hardware-Design, Embedded Firmware, Simulation, EMV-gerechtes Design, Prototypenentwicklung und Serienvalidierung. Spezialisiert auf Leistungselektronik mit SiC/GaN-Technologie, thermisches Management und funktionale Sicherheit (ISO 26262).</p>
            <ul>
              <li><a href="/entwicklung/hardware-software">Hardware- &amp; Softwareentwicklung</a> – Schaltungsentwicklung, PCB-Layout, Embedded Firmware</li>
              <li><a href="/entwicklung/simulation">Simulation</a> – Thermische, elektrische und EMV-Simulation mit COMSOL, PLECS, LTspice</li>
              <li><a href="/entwicklung/test-verifikation">Test &amp; Verifikation</a> – EMV-Prüfung, Umwelttests, Serienvalidierung</li>
              <li><a href="/entwicklung/ux-interface-engineering">UX &amp; Interface Engineering</a> – Benutzeroberflächen für technische Systeme</li>
              <li><a href="/entwicklung/software-digitale-systeme">Software &amp; Digitale Systeme</a> – Applikationssoftware, IoT, Cloud-Anbindung</li>
            </ul>
          </section>

          <section style="margin-bottom:2rem;">
            <h2>EMS-Fertigung</h2>
            <p>SMD- und THT-Bestückung, Prototypen- und Serienfertigung, Baugruppenmontage, AOI, Selektivlöten, Conformal Coating und lückenlose Traceability. Zertifiziert nach ISO 9001 und IATF 16949.</p>
            <ul>
              <li><a href="/fertigung/leiterplatten">Leiterplatten bestücken</a> – SMD/THT, Prototypen bis Großserie</li>
              <li><a href="/fertigung/baugruppen">Baugruppen fertigen</a> – Montage, Verguss, Systemintegration</li>
              <li><a href="/fertigung/qualitaet">Qualitätsmanagement</a> – AOI, ICT, Funktionstest, Traceability</li>
            </ul>
          </section>

          <section style="margin-bottom:2rem;">
            <h2>Lifecycle Services &amp; Reparatur</h2>
            <p>Obsoleszenzmanagement, Redesign, Ersatzteilstrategien und Reparaturservice für langlebige Elektronikprodukte.</p>
            <a href="/lifecycle">Mehr zu Lifecycle &amp; Reparatur</a>
          </section>

          <section style="margin-bottom:2rem;">
            <h2>Märkte &amp; Branchen</h2>
            <p>Projekte in Automotive, Industrieautomation, Gebäudetechnik, Medizintechnik, Antriebstechnik und Smart Devices.</p>
            <a href="/maerkte">Alle Märkte ansehen</a>
          </section>

          <section style="margin-bottom:2rem;">
            <h2>Über CME</h2>
            <p>Seit 2008 entwickelt und fertigt CME komplexe Embedded- und Leistungselektronik. Über 60 Mitarbeiter am Standort Dortmund. Zertifiziert nach ISO 9001 und IATF 16949. Entwicklung und Fertigung unter einem Dach.</p>
